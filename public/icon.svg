<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#pwaGrad)" />

  <!-- Chat bubble silhouette -->
  <g filter="url(#shadow)">
    <path d="M120 160 C120 120 152 90 200 90 L330 90 C378 90 410 120 410 160 L410 280 C410 320 378 350 330 350 L230 350 L160 410 L160 350 C130 350 120 330 120 290 Z" fill="#ffffff" fill-opacity="0.95" />
  </g>

  <!-- Wallet & Sparkle / Rupiah emblem inside -->
  <g transform="translate(196, 155)">
    <!-- Wallet Card Shape -->
    <rect x="0" y="20" width="120" height="84" rx="16" fill="#059669" />
    <!-- Wallet Flap -->
    <path d="M0 45 L120 45" stroke="#047857" stroke-width="4" />
    <circle cx="95" cy="62" r="9" fill="#f59e0b" />
    <circle cx="95" cy="62" r="5" fill="#ffffff" />
    <!-- Mini Coin / Rp symbol -->
    <text x="35" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">Rp</text>
  </g>

  <!-- AI Sparkles -->
  <g fill="#f59e0b">
    <!-- Star 1 -->
    <path d="M370 120 Q370 145 390 145 Q370 145 370 170 Q370 145 350 145 Q370 145 370 120 Z" />
    <!-- Star 2 -->
    <path d="M145 200 Q145 215 158 215 Q145 215 145 230 Q145 215 132 215 Q145 215 145 200 Z" fill="#38bdf8" />
  </g>

  <!-- Badge Text -->
  <text x="256" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2">CHATKEUANGAN</text>
</svg>
